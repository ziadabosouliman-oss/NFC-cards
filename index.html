<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة أعمال ذكية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
        }

        body {
            background-color: #0d0f12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background-color: #161920;
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
        }

        .avatar-box {
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #d4af37, #7a6012);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #242936;
            display: block;
        }

        .name {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .title {
            font-size: 15px;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 14px;
        }

        .bio {
            font-size: 14px;
            line-height: 1.7;
            color: #b5bcc9;
            margin-bottom: 20px;
        }

        .address {
            display: block;
            background-color: rgba(255, 255, 255, 0.05);
            color: #f3f4f6;
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #d4af37, #b38f22);
            color: #000000;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 18px;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .action-link {
            display: block;
            padding: 12px 8px;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .socials {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .social-link {
            padding: 9px 14px;
            border-radius: 999px;
            background-color: rgba(212, 175, 55, 0.12);
            color: #d4af37;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="card">
        <div id="avatar-wrapper" class="avatar-box hidden">
            <img id="c-image" class="avatar" src="" alt="صورة العميل">
        </div>

        <h1 id="c-name" class="name"></h1>
        <div id="c-title" class="title"></div>
        <p id="c-bio" class="bio"></p>

        <a id="c-address" class="address hidden" target="_blank" rel="noopener noreferrer"></a>

        <button id="save-btn" class="save-btn hidden" type="button" onclick="saveContact()">
            حفظ جهة الاتصال في الهاتف
        </button>

        <div class="actions">
            <a id="btn-call" class="action-link hidden">اتصال</a>
            <a id="btn-whatsapp" class="action-link hidden" target="_blank" rel="noopener noreferrer">واتساب</a>
            <a id="btn-email" class="action-link hidden">إيميل</a>
        </div>

        <div id="socials" class="socials"></div>
    </div>

    <script>
        // ==========================================
        // عدّل بيانات الزبون هنا عندما يأتيك زبون جديد
        // ==========================================
        const client = {
            name: "د. أحمد المنصور",
            title: "استشاري جراحة وتجميل الأسنان",
            bio: "خبرة أكثر من 15 عاماً في زراعة الأسنان وتصميم الابتسامة الرقمية.",
            image: "",
            phone: "+966500000001",
            whatsapp: "966500000001",
            email: "dr.ahmed@example.com",
            address: "الرياض - حي العليا",
            mapLink: "https://maps.google.com",
            socials: {
                "إنستغرام": "https://instagram.com/",
                "سناب شات": "https://snapchat.com/",
                "تيك توك": "",
                "فيسبوك": "",
                "لينكدإن": "",
                "الموقع": "https://example.com"
            }
        };

        document.title = client.name ? `${client.name} | ${client.title}` : "بطاقة أعمال ذكية";
        document.getElementById("c-name").textContent = client.name || "بطاقة أعمال ذكية";
        document.getElementById("c-title").textContent = client.title || "";
        document.getElementById("c-bio").textContent = client.bio || "";

        if (client.image && client.image.trim() !== "") {
            document.getElementById("c-image").src = client.image;
            document.getElementById("avatar-wrapper").classList.remove("hidden");
        }

        const addrEl = document.getElementById("c-address");
        if (client.address) {
            addrEl.textContent = "📍 " + client.address;
            addrEl.classList.remove("hidden");
            if (client.mapLink) {
                addrEl.href = client.mapLink;
            } else {
                addrEl.removeAttribute("href");
            }
        }

        if (client.phone) {
            document.getElementById("save-btn").classList.remove("hidden");
            const callEl = document.getElementById("btn-call");
            callEl.href = "tel:" + client.phone;
            callEl.classList.remove("hidden");
        }

        if (client.whatsapp) {
            const waEl = document.getElementById("btn-whatsapp");
            const cleanNum = client.whatsapp.replace(/[^0-9]/g, "");
            waEl.href = "https://wa.me/" + cleanNum;
            waEl.classList.remove("hidden");
        }

        if (client.email) {
            const mailEl = document.getElementById("btn-email");
            mailEl.href = "mailto:" + client.email;
            mailEl.classList.remove("hidden");
        }

        const socialsEl = document.getElementById("socials");
        Object.entries(client.socials).forEach(([label, url]) => {
            if (url && url.trim() !== "") {
                const a = document.createElement("a");
                a.className = "social-link";
                a.href = url;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.textContent = label;
                socialsEl.appendChild(a);
            }
        });

        function saveContact() {
            const vcard = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                `FN:${client.name || ""}`,
                `TITLE:${client.title || ""}`,
                `TEL;TYPE=CELL:${client.phone || ""}`,
                `EMAIL:${client.email || ""}`,
                `ADR:;;${client.address || ""};;;;`,
                "END:VCARD"
            ].join("\n");

            const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `${client.name || "contact"}.vcf`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
