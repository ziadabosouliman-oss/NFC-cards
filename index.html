<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة أعمال ذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161920;
            --gold: #d4af37;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(212, 175, 55, 0.25);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #997a15, var(--gold), #997a15);
        }

        .avatar-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 18px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--gold), #5c4808);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #222;
        }

        .name {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .title {
            font-size: 15px;
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 15px;
        }

        .bio {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 22px;
            padding: 0 10px;
        }

        .address-box {
            background: rgba(255, 255, 255, 0.04);
            padding: 12px 15px;
            border-radius: 14px;
            font-size: 13px;
            color: #e5e7eb;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        .address-box:hover {
            border-color: var(--gold);
        }

        .address-box i {
            color: var(--gold);
            font-size: 16px;
        }

        .save-btn {
            background: linear-gradient(135deg, var(--gold), #b59224);
            color: #000;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.45);
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            text-decoration: none;
            padding: 14px 10px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: 0.3s;
        }

        .action-btn i {
            font-size: 20px;
            color: var(--gold);
        }

        .action-btn:hover {
            background: rgba(212, 175, 55, 0.12);
            border-color: var(--gold);
        }

        .socials {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .social-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

            background: var(--gold);
            color: #0
